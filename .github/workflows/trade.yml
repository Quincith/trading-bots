name: Trade (paper)

# Runs every strategy every 30 minutes. The Timer workflow (timer.yml) starts it on the beat, because
# GitHub's own schedule skips many runs. The schedule here is a backup. Off the hour on purpose: GitHub
# is busiest at :00 and :30. Scheduled runs only start once this file is on the main branch.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      strategy:
        description: Which strategy to run
        type: choice
        options: [all, aggressive, medium, copycat]
        default: all
      dry_run:
        description: Dry run (think, but don't place orders)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: bot-data
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALPACA_AGGRESSIVE_KEY_ID: ${{ secrets.ALPACA_AGGRESSIVE_KEY_ID }}
      ALPACA_AGGRESSIVE_SECRET_KEY: ${{ secrets.ALPACA_AGGRESSIVE_SECRET_KEY }}
      ALPACA_MEDIUM_KEY_ID: ${{ secrets.ALPACA_MEDIUM_KEY_ID }}
      ALPACA_MEDIUM_SECRET_KEY: ${{ secrets.ALPACA_MEDIUM_SECRET_KEY }}
      ALPACA_COPYCAT_KEY_ID: ${{ secrets.ALPACA_COPYCAT_KEY_ID }}
      ALPACA_COPYCAT_SECRET_KEY: ${{ secrets.ALPACA_COPYCAT_SECRET_KEY }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}   # a secret, so it's hidden in the public logs
      TRADING_HALTED: ${{ vars.TRADING_HALTED }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load saved bot data
        run: ./scripts/data-branch.sh pull
      - name: Aggressive
        id: aggressive
        if: ${{ github.event_name == 'schedule' || !inputs.strategy || inputs.strategy == 'all' || inputs.strategy == 'aggressive' }}
        run: python -m tradebots run --strategy aggressive
        continue-on-error: true
      - name: Medium
        id: medium
        if: ${{ github.event_name == 'schedule' || !inputs.strategy || inputs.strategy == 'all' || inputs.strategy == 'medium' }}
        run: python -m tradebots run --strategy medium
        continue-on-error: true
      - name: Copycat
        id: copycat
        # Skipped until its Alpaca keys are added, so the other two stay green in the meantime.
        if: ${{ env.ALPACA_COPYCAT_KEY_ID != '' && (github.event_name == 'schedule' || !inputs.strategy || inputs.strategy == 'all' || inputs.strategy == 'copycat') }}
        run: python -m tradebots run --strategy copycat
        continue-on-error: true
      - name: Build the bot world page and daily recap
        if: always()
        run: python -m tradebots.world
        continue-on-error: true
      - name: Save bot data
        if: always()
        run: ./scripts/data-branch.sh push "run ${{ github.run_number }}"
      - name: Upload the bot world page
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: data/world
        continue-on-error: true
      - name: Report failures
        if: ${{ steps.aggressive.outcome == 'failure' || steps.medium.outcome == 'failure' || steps.copycat.outcome == 'failure' }}
        run: |
          echo "One of the strategies failed. Open its step above to see why." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  # Publishes the page to GitHub Pages. Needs Settings > Pages > Source: "GitHub Actions" (one time).
  # It never turns a trading run red: if Pages isn't set up yet, this job just shows a warning.
  world:
    needs: trade
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
