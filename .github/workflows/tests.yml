name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # Live check that the SEC insider feed Copycat reads still works. Needs no keys, only the
      # SEC_CONTACT_EMAIL secret.
      # It never fails the tests, because the SEC site can be briefly down.
      - name: Copycat feed check (live, SEC)
        run: python -m tradebots copycat-preview
        continue-on-error: true
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
