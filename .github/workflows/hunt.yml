name: Hunt test

# Runs the four bold rules in tradebots/hunt.py (leveraged Nasdaq trend, leveraged dip-buying, multi-market
# trend, crypto rotation) on 10 years of Alpaca daily prices through the strategy lab's checks.
# It only reports: nothing is saved and no settings change. The report shows on the run page.
on:
  workflow_dispatch:
  push:   # TRIAL ONLY: remove before merge
    branches: [claude/project-thread-y0esfp]

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALPACA_MEDIUM_KEY_ID: ${{ secrets.ALPACA_MEDIUM_KEY_ID }}
      ALPACA_MEDIUM_SECRET_KEY: ${{ secrets.ALPACA_MEDIUM_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download 10 years of prices and run all four rules
        run: |
          python -m tradebots.hunt --out report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
