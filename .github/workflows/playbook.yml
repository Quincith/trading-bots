name: Playbook test

# Runs the five textbook kinds of trading (trend following, breakout, swing, day trading, scalping) on the
# past 5 years of Alpaca crypto prices, for both Aggressive and Medium, through the strategy lab's checks.
# It only reports: nothing is saved and no settings change. The report shows on the run page.
on:
  workflow_dispatch:

jobs:
  playbook:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALPACA_MEDIUM_KEY_ID: ${{ secrets.ALPACA_MEDIUM_KEY_ID }}
      ALPACA_MEDIUM_SECRET_KEY: ${{ secrets.ALPACA_MEDIUM_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download 5 years of prices and run all five rules for both accounts
        run: |
          python -m tradebots.playbook --out report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
