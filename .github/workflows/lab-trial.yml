name: Forex lab trial (temporary)

# Temporary: tests the Forex wing's two strategies on real past prices from this pull request, so we can see
# honest results before merging. It saves nothing to the repo and opens no pull requests or issues. Dukascopy
# allows only a few downloads at a time, so downloaded files are kept in the Actions cache and each re-run
# picks up where the last one stopped. Removed before merge.
on:
  pull_request:
    paths: [".github/workflows/lab-trial.yml"]

env:
  FX_CACHE_DIR: fxcache
  END: "2026-10-01"
  # once the OANDA practice key is saved, the test uses OANDA's own prices instead of Dukascopy's
  OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: fxcache
          key: fxdata-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fxdata-
      - name: Download past prices (8 years plus a warm-up year)
        run: |
          python - <<'PY'
          from datetime import date
          from tradebots import forex, fxdata
          for p in forex.PAIRS:
              df = fxdata.daily_prices(p, date(2017, 8, 1), date(2026, 10, 1))
              print(p, len(df), "days", df.index[0].date(), "to", df.index[-1].date(), flush=True)
          r = fxdata.fetch_policy_rates(date(2016, 1, 1))
          print(r.resample("YE").last().round(2).to_string())
          PY
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: fxcache
          key: fxdata-${{ github.run_id }}-${{ github.run_attempt }}
      - name: "Second try, settings fixed in advance: 12-month momentum and the carry trade"
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from tradebots import lab
          end = datetime(2026, 10, 1, tzinfo=timezone.utc)
          ideas = {
              "12-month momentum": {"style": "momentum", "momentum_days": 365, "atr_days": 20, "stop_atr_mult": 5.0},
              "Carry trade": {"style": "carry", "carry_enter_pct": 1.0, "carry_exit_pct": 0.5, "atr_days": 20,
                              "stop_atr_mult": 5.0},
          }
          for name, fx in ideas.items():
              cfg = lab.load_config("forex"); cfg["forex"] = fx
              eng = lab.load_engine("forex", 365, "fx.pkl", end)
              print(f"\n\n######## {name}\n")
              print(lab.validate("forex", eng, lab.Runner(eng), cfg)[1])
          PY
      - name: "First try again, now with real interest rates for overnight financing"
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from tradebots import lab
          end = datetime(2026, 10, 1, tzinfo=timezone.utc)
          for name in ("forex", "fxcopy"):
              cfg = lab.load_config(name)
              eng = lab.load_engine(name, 365, "fx.pkl", end)
              v, text = lab.validate(name, eng, lab.Runner(eng), cfg)
              print(text.split("## Checks")[0])
          PY
      - name: "Where the results come from: zero costs, by pair, by exit"
        run: |
          python - <<'PY'
          from collections import defaultdict
          from datetime import datetime, timezone
          from tradebots import forex, lab
          end = datetime(2026, 10, 1, tzinfo=timezone.utc)
          mom = {"style": "momentum", "momentum_days": 365, "atr_days": 20, "stop_atr_mult": 5.0}
          carry = {"style": "carry", "carry_enter_pct": 1.0, "carry_exit_pct": 0.5, "atr_days": 20, "stop_atr_mult": 5.0}
          for name, fx in (("momentum", mom), ("carry", carry)):
              cfg = lab.load_config("forex"); cfg["forex"] = fx
              eng = lab.load_engine("forex", 365, "fx.pkl", end)
              for cost in (0.0, 1.0):
                  r = forex.simulate(cfg, eng.bars, eng.cot, eng.start, end, cost=cost, rates=eng.rates)
                  print(f"\n== {name} cost x{cost}: end ${r.equity[-1][1]:.2f}, fees ${r.fees:.2f}, trades {len(r.trades)}")
                  by_pair, by_exit = defaultdict(list), defaultdict(list)
                  for t in r.trades:
                      rr = t["pnl"] / max(t["equity_at_open"], 1e-9) * 100
                      by_pair[t["symbol"]].append(rr); by_exit[t["exit"].split(" ")[0]].append(rr)
                  for k, v in sorted(by_pair.items()):
                      print(f"  {k:8s} n={len(v):3d} sum={sum(v):+6.1f}% win={sum(x>0 for x in v)/len(v):.0%}")
                  for k, v in sorted(by_exit.items()):
                      print(f"  exit {k:10s} n={len(v):3d} sum={sum(v):+6.1f}%")
          PY
