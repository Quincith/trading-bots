name: Strategy lab trial (temporary)

# Temporary: runs the strategy lab once on real prices from this pull request, so we can see real
# results before merging. It saves nothing and opens no pull requests or issues. Removed before merge.
on:
  pull_request:
    paths: [".github/workflows/lab-trial.yml"]

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ALPACA_MEDIUM_KEY_ID: ${{ secrets.ALPACA_MEDIUM_KEY_ID }}
      ALPACA_MEDIUM_SECRET_KEY: ${{ secrets.ALPACA_MEDIUM_SECRET_KEY }}
      ALPACA_COPYCAT_KEY_ID: ${{ secrets.ALPACA_COPYCAT_KEY_ID }}
      ALPACA_COPYCAT_SECRET_KEY: ${{ secrets.ALPACA_COPYCAT_SECRET_KEY }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      DATA_DIR: trial-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: nproc
      - name: Run the lab (Claude suggests one change per strategy)
        run: time python -m tradebots.improve --out lab-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-trial
          path: |
            lab-out
            trial-data/lab
