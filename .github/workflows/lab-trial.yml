name: Forex lab trial (temporary)

# Temporary: tests the Forex wing's two strategies on real past prices from this pull request, so we can see
# honest results before merging. It saves nothing to the repo and opens no pull requests or issues. Dukascopy
# allows only a few downloads at a time, so downloaded files are kept in the Actions cache and each re-run
# picks up where the last one stopped. Removed before merge.
on:
  pull_request:
    paths: [".github/workflows/lab-trial.yml"]

env:
  FX_CACHE_DIR: fxcache
  END: "2026-10-01"
  # once the OANDA practice key is saved, the test uses OANDA's own prices instead of Dukascopy's
  OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}

jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: fxcache
          key: fxdata-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fxdata-
      - name: Download past prices (8 years plus a warm-up year)
        run: |
          python - <<'PY'
          from datetime import date
          from tradebots import forex, fxdata
          for p in forex.PAIRS:
              df = fxdata.daily_prices(p, date(2017, 8, 1), date(2026, 10, 1))
              print(p, len(df), "days", df.index[0].date(), "to", df.index[-1].date(), flush=True)
          PY
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: fxcache
          key: fxdata-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Forex (trend) check
        run: python -m tradebots.lab --strategy forex --validate --cache fx.pkl --end $END
      - name: Copycat FX check
        run: python -m tradebots.lab --strategy fxcopy --validate --cache fx.pkl --end $END
      - name: "For comparison: Copycat FX copying asset managers instead"
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from tradebots import lab
          cfg = lab.load_config("fxcopy"); cfg["forex"]["group"] = "asset_managers"
          eng = lab.load_engine("fxcopy", 365, "fx.pkl", datetime(2026, 10, 1, tzinfo=timezone.utc))
          print(lab.validate("fxcopy", eng, lab.Runner(eng), cfg)[1])
          PY
      - name: "For comparison: Forex without the 200-day average filter"
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          from tradebots import lab
          cfg = lab.load_config("forex"); cfg["forex"]["trend_ema_days"] = 0
          eng = lab.load_engine("forex", 365, "fx.pkl", datetime(2026, 10, 1, tzinfo=timezone.utc))
          print(lab.validate("forex", eng, lab.Runner(eng), cfg)[1])
          PY
