# MEDIUM strategy: smaller bets, holds for days, only buys on a clear BUY.
# Runs in its own Alpaca paper account so its results stay separate.
# All percents are percent of the account's current equity.

name: medium
alpaca_key_secret: ALPACA_MEDIUM_KEY_ID
alpaca_secret_secret: ALPACA_MEDIUM_SECRET_KEY

markets:
  crypto: [BTC/USD, ETH/USD, SOL/USD, AVAX/USD, LINK/USD, DOGE/USD, LTC/USD, XRP/USD]
  stocks: []

scout:
  scan_every_minutes: 120
  bar_timeframe: 1Hour
  lookback_bars: 300
  volume_window: 24
  min_volume_ratio: 1.3
  min_move_pct: 2.0
  move_bars: 12
  min_rsi: 50               # momentum (RSI) must be between these two
  max_rsi: 78
  max_candidates: 3

charts:
  ema_fast: 20
  ema_slow: 50
  swing_window: 8
  atr_period: 14
  stop_atr_mult: 2.0
  min_reward_risk: 2.0

risk:
  risk_per_trade_pct: 2
  max_position_pct: 25
  max_total_exposure_pct: 75
  max_open_positions: 4
  correlation_threshold: 0.85
  correlated_size_factor: 0.5
  max_correlated_positions: 1
  # Loss limits confirmed by Quincy on 2026-10-24
  max_daily_loss_pct: 3     # stop opening trades for the day after losing 3% today
  max_total_loss_pct: 15    # halt the strategy if it is down 15% from money put in
  min_order_usd: 2

decision:
  buy_only_on: BUY
  min_confidence: 0.7

exits:
  max_hold_hours: 120
  move_stop_to_breakeven_at_r: 1.5

ai:
  model: claude-opus-5-5
  effort: low

# Extra "don't buy when..." rules. 0 means off. The strategy lab tests changes like these each week,
# and only a change you approve (by merging its pull request) switches one on.
filters:
  max_atr_pct: 0      # skip coins swinging more than this % per candle (too wild)
  trend_ema_bars: 0   # only buy when the coin is above its N-candle average (uptrend)
  btc_ema_bars: 0     # only buy when Bitcoin is above its N-candle average (healthy market)
  min_fear_greed: 0   # skip when the crypto Fear & Greed index is below this (panic)
  max_fear_greed: 0   # skip when it is above this (greed)
