# AGGRESSIVE strategy: bigger bets, short holds (hours).
# Runs in its own Alpaca paper account so its results stay separate.
# All percents are percent of the account's current equity.

name: aggressive
# GitHub secret names that hold this account's Alpaca paper keys.
alpaca_key_secret: ALPACA_AGGRESSIVE_KEY_ID
alpaca_secret_secret: ALPACA_AGGRESSIVE_SECRET_KEY

markets:
  crypto: [BTC/USD, ETH/USD, SOL/USD, AVAX/USD, LINK/USD, DOGE/USD, LTC/USD, XRP/USD]
  # Add stock tickers here to trade stocks too (only during market hours), e.g. [NVDA, AMD, TSLA]
  stocks: []

scout:
  scan_every_minutes: 30  # how often to look for new trades (exits are checked every run)
  bar_timeframe: 15Min      # candle size the bots look at
  lookback_bars: 200        # how much history to load
  volume_window: 20         # compare the latest volume to this many bars before it
  min_volume_ratio: 1.5     # volume must be at least 1.5x normal
  min_move_pct: 1.0         # price must have moved at least 1% over the last few bars
  move_bars: 4
  min_rsi: 50               # momentum (RSI) must be between these two
  max_rsi: 78
  max_candidates: 3         # only the best 3 go on to the other bots

radar:
  # News radar: reads all crypto news every scan (Alpaca/Benzinga, CoinDesk, Cointelegraph, Decrypt,
  # and CoinGecko's most-searched coins) to spot trends while they're forming. Both strategies share one
  # sweep, so keep this section the same in aggressive.yaml and medium.yaml.
  enabled: true
  window_hours: 24          # how much news to read
  recent_hours: 4           # "buzz" = headlines in the last 4 hours vs. the usual pace before that
  model: claude-haiku-5-5   # Claude reads the headlines once an hour; Haiku costs about $0.50/month for this
  claude_every_minutes: 60  # between Claude reads the free counts still update every scan
  # Early watch: let coins with strong news buzz past Scout with looser rules, to get in before the crowd.
  # Off until it has been tested in the strategy lab (see README).
  early_watch: false
  early_min_score: 0.5      # radar score (-1..+1) a coin needs to get on the early watch list
  early_factor: 0.5         # early-watch coins need only half the usual volume jump and price move

charts:
  ema_fast: 20
  ema_slow: 50
  swing_window: 5           # bars on each side used to find support / resistance
  atr_period: 14
  stop_atr_mult: 1.5        # stop goes 1.5 ATR below entry (or just under support)
  min_reward_risk: 1.5      # target must pay at least 1.5x what the stop risks

risk:
  risk_per_trade_pct: 7.5   # lose at most ~7.5% of the account if the stop is hit
  max_position_pct: 40      # one position can be at most 40% of the account
  max_total_exposure_pct: 90
  max_open_positions: 3
  correlation_threshold: 0.85
  correlated_size_factor: 0.5   # halve the size if it moves with something we already hold
  max_correlated_positions: 2   # reject if 2 held positions already move with it
  # Loss limits confirmed by Quincy on 2026-10-24
  max_daily_loss_pct: 10    # stop opening trades for the day after losing 10% today
  max_total_loss_pct: 40    # halt the strategy if it is down 40% from money put in
  min_order_usd: 2

decision:
  buy_only_on: BUY
  min_confidence: 0.55

exits:
  max_hold_hours: 12
  move_stop_to_breakeven_at_r: 1.0   # once up 1x the risk, move the stop to the entry price

ai:
  model: claude-opus-5-5
  effort: low

# Extra "don't buy when..." rules. 0 means off. The strategy lab tests changes like these each week,
# and only a change you approve (by merging its pull request) switches one on.
filters:
  max_atr_pct: 0      # skip coins swinging more than this % per candle (too wild)
  trend_ema_bars: 0   # only buy when the coin is above its N-candle average (uptrend)
  btc_ema_bars: 0     # only buy when Bitcoin is above its N-candle average (healthy market)
  min_fear_greed: 0   # skip when the crypto Fear & Greed index is below this (panic)
  max_fear_greed: 0   # skip when it is above this (greed)
